# Regression fixture: every pattern here is declared with a non-global regex in
# src/rules/infra. Before the asGlobal() fix in pattern-engine, scanning this file
# spun forever in exec() and killed the process with an OOM at ~18s.
apiVersion: v1
kind: Pod
metadata:
  name: regression-pod
spec:
  hostNetwork: true
  hostPID: true
  containers:
    - name: app
      image: example/app:latest
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
        runAsUser: 0
        readOnlyRootFilesystem: false
